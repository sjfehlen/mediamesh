services:
  mediamesh:
    build: .
    image: mediamesh:latest
    container_name: mediamesh
    restart: unless-stopped
    environment:
      NODE_NAME: "Your Node Name"
      PUBLIC_URL: "https://mediamesh.yourdomain.com"
      DATA_DIR: "/data"
      JELLYFIN_URL: "http://your-jellyfin-host:8096"
      JELLYFIN_API_KEY: ""
      ABS_URL: "http://your-abs-host:13378"
      ABS_API_KEY: ""
      TMDB_API_KEY: ""
    volumes:
      - ./data:/data
      - ./media/movies:/media/movies
      - ./media/tv:/media/tv
      - ./media/audiobooks:/media/audiobooks
      - ./media/ebooks:/media/ebooks
      - ./media/kids-audiobooks:/media/kids-audiobooks
      - ./media/kids-ebooks:/media/kids-ebooks
    ports:
      - "8080:8080"
