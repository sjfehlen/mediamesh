services:
  mediamesh:
    build: .
    image: mediamesh:latest
    container_name: mediamesh
    restart: unless-stopped
    environment:
      NODE_NAME: "Samuel's Media Mesh"
      PUBLIC_URL: "https://mediamesh.fehlenfusion.com"
      DATA_DIR: "/data"
      JELLYFIN_URL: "http://10.5.1.57:30013"
      JELLYFIN_API_KEY: ""
      ABS_URL: "http://10.5.1.57:30067"
      ABS_API_KEY: ""
      TMDB_API_KEY: ""  # Set your TMDB API key here or via environment
    volumes:
      - /home/samuel/mediamesh-test/data:/data
      - /home/samuel/mediamesh-test/movies:/media/movies
      - /home/samuel/mediamesh-test/tv:/media/tv
      - /home/samuel/mediamesh-test/audiobooks:/media/audiobooks
      - /home/samuel/mediamesh-test/ebooks:/media/ebooks
      - /home/samuel/mediamesh-test/audiobooks:/media/kids-audiobooks
      - /home/samuel/mediamesh-test/ebooks:/media/kids-ebooks
    ports:
      - "30090:8080"
