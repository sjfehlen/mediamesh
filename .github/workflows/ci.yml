name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install sqlite3 build deps
        run: sudo apt-get install -y gcc libsqlite3-dev
      - run: go vet ./...
        env:
          CGO_ENABLED: "1"
      - run: go test ./...
        env:
          CGO_ENABLED: "1"
      - run: go build ./...
        env:
          CGO_ENABLED: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
